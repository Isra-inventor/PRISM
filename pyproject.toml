[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-omics"
version = "0.11.0"
description = "PRISM: recognize, audit and preprocess proteomics abundance tables, step by step."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["registry/*.yaml", "registry/*.json", "audit/*.yaml", "rules/*.yaml", "phase2/*.yaml", "ports/probatch/*.md"]
