# Joint decision nodes (Build Request v4, sections 5.9 and 6.2), as data. The plan engine resolves
# a joint node in one go. D2: batch correction decided together with the missingness handling.
nodes:
  - id: D2
    steps: [S2, S6]
    evidence: [cuklina2021, hui2023, hui_chan_goh2025]
    evidence_level: expert_guidance
    cases:
      - id: D2.no_missing
        when: {any_missing: false}
        then: {status: Recommended, order: [batch_correction], text: "No missing values: batch correction is decided on its own."}
      - id: D2.tolerant_first
        when: {any_missing: true, method_tolerates_missing: true}
        then:
          status: Recommended
          order: [batch_correction_nan_tolerant, hand_off_to_method_selection]
          text: >-
            Correct with a NaN-tolerant method first (median centering, LOESS). If the later statistical
            method needs complete data, impute after correction and within batch (hand-off; nothing is
            imputed in this build).
      - id: D2.combat_incomplete
        when: {any_missing: true, method_tolerates_missing: false}
        then:
          status: Do not automate
          order: []
          alternatives: [batch_center, remove_incomplete_features]
          text: >-
            The chosen correction (ComBat) does not tolerate missing values. Alternatives: batch_center
            (NaN tolerant), or remove the incomplete features (cost reported).
