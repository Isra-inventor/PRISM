# Tier 1 audit parameters (v3 §6.4). Every value used is recorded in the run manifest;
# a changed value changes params_sha256. Values marked "heuristic" are rules of thumb, and the
# report labels them as such.
seed: 0
permutations: 999                  # Monte Carlo permutations when more than exhaustive_max exist
exhaustive_max: 10000              # enumerate every distinct permutation up to this many
modified_z_cutoff: 3.5             # heuristic (Iglewicz and Hoaglin)
max_pcs: 5                         # k = min(max_pcs, n - 1)
rsd_levels: [20, 30]               # heuristic, percent
median_scaling_mad: 0.5            # heuristic: MAD of log2 per-feature medians below this
sentinel_share: 0.01               # heuristic: one value covering this share of cells
near_duplicate_r: 0.9999           # heuristic
floor_min_observed: 5              # features need this many observed values for floor ties
floor_tie_share_indicator: 0.01    # heuristic: floor ties are reported as "present" from this share of features
narrow_median_spread: 0.05         # heuristic: MAD (log2) of sample medians below this reads as normalized
abundance_rho_indicator: -0.1      # heuristic: rho at or below this gets the censoring sentence
time_ordered_max_levels: 12        # time is an ordered factor up to this many values, else numeric
categorical_max_levels: 20         # categorical covariates with 2 to this many levels
icc_indicator: 0.5                 # share of features with ICC above this is reported
bootstrap: 999                     # A3 bootstrap resamples
diag_min_features: 20              # heuristic (v4 §3): complete_features(100) needs this many features, else q = 75, 50
diag_min_share: 0.1                # heuristic (v4 §3): ... and this share of all features
diag_sample_missing_max: 0.5       # heuristic (v4 §3): for q < 100, samples missing more than this share are dropped
a12_bootstrap: 200                 # A12.4 bootstrap resamples over features for the b1 CI
a12_min_partial_features: 50       # heuristic (v4 §5.4): features with 0 < d < n needed for the detection curve
a12_b1_negligible: 0.1             # heuristic (v4 §5.7): |b1| CI inside +-this (per log2 unit) reads as "no" intensity dependence
a12_batch_absence_share: 0.01      # heuristic (v4 §5.7): batch-wide absence above this share reads as batch-associated
a12_low_abundance_fraction: 0.3333 # heuristic (v4 §5.6): "lowest third" of features by mean observed Y
a12_min_level_n: 3                 # v4 §5.3: a batch level needs this many samples for batch-wide absence
a12_feature_permutations: 999      # per-feature NaN-indicator tests: Monte Carlo permutations (no exhaustive enumeration)
blank_dominated_ratio: 0.5         # heuristic (v4 §4.3): G3 flags features whose mean blank signal is this share of the study mean
batch_min_samples: 25              # heuristic (v4 §4.4): quoted in Cuklina et al. 2021 as a suggestion from other work; unverified
