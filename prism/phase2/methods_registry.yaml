# Downstream statistical methods PRISM will later recommend (Build Request v4, section 5.9), with
# whether each tolerates missing values: yes | no | native (a detection or hurdle model inside the
# test). Seeded with the three entries of the build request only; every other method is absent.
methods:
  - id: detection_or_hurdle_models
    methods: [msqrob2 hurdle workflow, Li and Smyth's test]
    tolerates_missing: native
    source: the packages' documentation (msqrob2 Bioconductor page; the Li and Smyth abstract)
    evidence: [msqrob2_docs, li_smyth2023]
    evidence_level: literature_independent
  - id: pca_plsda_standard
    methods: [PCA, PLS-DA]
    tolerates_missing: "no"
    source: Wei et al. 2018 state that they need complete data
    evidence: [wei2018]
    evidence_level: literature_independent
  - id: msstats_mofa
    methods: [MSstats, MOFA]
    tolerates_missing: null
    source: not filled in - not verified in this build
    evidence: []
    evidence_level: unverified
